<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Crea tu sexy avatar (SFW) - Deseo Libre</title>
    <link rel="stylesheet" href="public/css/components.css" />
    <style>
        .ai-studio { max-width: 860px; margin: 32px auto; padding: 16px; }
        .result { margin-top: 16px; }
        img.preview { max-width: 100%; border-radius: 8px; }
        .note { color: var(--medium-gray); margin: 8px 0 16px; }
        textarea { width: 100%; padding: 10px; border: 1px solid var(--light-gray); border-radius: 8px; }
        button.primary { margin-top: 8px; padding: 10px 16px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--coral-pink), var(--deep-purple)); color: #fff; cursor: pointer; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<script>
    // Redirigir a localhost si se abre como file://
    if (location.protocol === 'file:') {
        const path = 'ai-studio.html';
        const target = `http://localhost:3000/${path}`;
        try { window.location.replace(target); } catch(_) { window.location.href = target; }
    }
  </script>
</head>
<body>
    <header style="background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.08);">
        <div style="max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:1rem 20px;">
            <a href="index.html" style="font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;background:linear-gradient(45deg,var(--coral-pink),var(--deep-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;">Deseo Libre</a>
            <nav>
                <ul style="display:flex;list-style:none;gap:2rem;align-items:center;margin:0;padding:0;">
                    <li><a href="home.html" style="text-decoration:none;color:var(--text-dark);font-weight:500;">Inicio</a></li>
                    <li><a href="index.html#servicios" style="text-decoration:none;color:var(--text-dark);font-weight:500;">Servicios</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="ai-studio">
        <h1>Crea tu sexy avatar (SFW)</h1>
        <p class="note">Genera imágenes artísticas aptas para todo público. El sistema bloquea términos no permitidos.</p>

        <form id="aiForm">
            <label for="prompt">Describe lo que quieres generar</label>
            <textarea id="prompt" rows="3" placeholder="Ej: retrato ilustrado estilo acuarela, look glam, fondo minimalista"></textarea>
            <button type="submit" class="primary">Generar</button>
        </form>

        <div class="result" id="result"></div>
    </main>

    <script>
        const form = document.getElementById('aiForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) { result.textContent = 'Ingresa un prompt.'; return; }
            result.textContent = 'Generando...';

            try {
                const r = await fetch('/api/ai/generate-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.error || 'Error');

                result.innerHTML = '';
                const img = document.createElement('img');
                img.className = 'preview';
                img.src = data.imageDataUrl;
                result.appendChild(img);
            } catch (err) {
                result.textContent = `Error: ${err.message}`;
            }
        });
    </script>
</body>
</html>
