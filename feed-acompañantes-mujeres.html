<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Feed CATEGORIA - Deseo Libre</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/responsive.css" rel="stylesheet">
    <link href="/css/components.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #131722;
            --charcoal: #1f2430;
            --text-light: rgba(255, 255, 255, 0.95);
            --text-muted: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(27, 32, 46, 0.9);
            --border-color: rgba(255, 255, 255, 0.14);
            --btn-gradient: linear-gradient(135deg, rgba(255, 107, 150, 0.95), rgba(108, 92, 231, 0.92));
            --btn-gradient-hover: linear-gradient(135deg, rgba(255, 120, 168, 1), rgba(131, 115, 255, 0.98));
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 12% 18%, rgba(255, 107, 107, 0.55), transparent 55%),
                        radial-gradient(circle at 80% 85%, rgba(255, 143, 143, 0.35), transparent 52%),
                        linear-gradient(145deg, rgba(255, 107, 150, 0.35), rgba(255, 107, 107, 0.18), rgba(27, 32, 46, 0.92));
            min-height: 100vh;
            padding: 24px;
            color: var(--text-light);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: linear-gradient(160deg, rgba(255, 107, 107, 0.28), rgba(27, 32, 46, 0.92));
            border-radius: 28px;
            padding: 38px;
            border: 1px solid var(--border-color);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
        }
        
        h1 {
            color: var(--text-light);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: 'Playfair Display', serif;
        }
        
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }
        
        .post-card {
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            background: var(--card-bg);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .post-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 35px 65px rgba(0, 0, 0, 0.5);
        }

        .post-card.premium {
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.35);
        }

        .premium-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #ffd700, #ff9f1c);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
            z-index: 10;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .post-content {
            padding: 18px;
        }
        
        .post-title {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-light);
        }
        
        .post-description {
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.6;
        }
        
        .post-user {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .post-meta {
            margin-top: 12px;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.55);
            display: flex;
            gap: 18px;
        }
        
        .btn {
            background: var(--btn-gradient);
            color: var(--text-light);
            padding: 12px 30px;
            border: none;
            border-radius: 28px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            font-weight: 600;
            box-shadow: 0 18px 40px rgba(255, 107, 107, 0.38);
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 55px rgba(255, 107, 107, 0.45);
            background: var(--btn-gradient-hover);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(150deg, rgba(255, 107, 107, 0.28), rgba(27, 32, 46, 0.92));
            padding: 30px;
            border-radius: 18px;
            max-width: 500px;
            width: 90%;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-light);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
        }
        
        .error {
            color: var(--error);
            padding: 10px;
            background: rgba(255, 77, 109, 0.15);
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid var(--error);
        }
        
        .success {
            color: var(--success);
            padding: 10px;
            background: rgba(46, 204, 113, 0.15);
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid var(--success);
        }
        
        .no-posts {
            text-align: center;
            padding: 50px;
            color: rgba(255, 255, 255, 0.65);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .container {
                padding: 28px;
            }

            .feed-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
                border-radius: 20px;
            }

            .feed-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }

            h1 {
                font-size: clamp(1.5rem, 5vw, 2rem);
                margin-bottom: 20px;
            }

            .post-image {
                height: 200px;
            }

            .post-content {
                padding: 15px;
            }

            .post-title {
                font-size: 1.1em;
            }

            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
                min-height: 44px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
                border-radius: 15px;
            }

            .feed-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            h1 {
                font-size: clamp(1.3rem, 6vw, 1.6rem);
                margin-bottom: 15px;
                flex-direction: column;
                text-align: center;
            }

            .post-image {
                height: 180px;
            }

            .post-content {
                padding: 12px;
            }

            .post-title {
                font-size: 1em;
            }

            .post-description {
                font-size: 0.85rem;
            }

            .btn {
                width: 100%;
                margin: 5px 0;
                padding: 12px;
                font-size: 0.9rem;
            }

            .no-posts {
                padding: 30px 20px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 12px;
                border-radius: 12px;
            }

            .feed-grid {
                gap: 10px;
            }

            h1 {
                font-size: clamp(1.2rem, 5vw, 1.4rem);
                margin-bottom: 12px;
            }

            .post-image {
                height: 160px;
            }

            .post-content {
                padding: 10px;
            }

            .post-title {
                font-size: 0.95em;
            }

            .post-description {
                font-size: 0.8rem;
            }

            .btn {
                padding: 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
        <div class="container">
        <h1><span style="font-size: 2em;">👩</span> Acompañantes Mujeres</h1>
        
        <div>
            <button class="btn" onclick="showLogin()">Iniciar Sesión</button>
            <button class="btn" onclick="showRegister()">Registrarse</button>
            <button class="btn" onclick="showCreatePost()" id="createBtn" style="display:none;">Crear Publicación</button>
                    </div>

        <div id="messageBox"></div>

        <div id="feedGrid" class="feed-grid">
            <div class="no-posts">Cargando publicaciones...</div>
                </div>
                </div>

    <!-- Modal Login -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm" onsubmit="login(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
            </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" required>
        </div>
                <button type="submit" class="btn">Entrar</button>
                <button type="button" class="btn" onclick="closeModal('loginModal')">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Modal Register -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h2>Registrarse</h2>
            <form id="registerForm" onsubmit="register(event)">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="regUsername" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPassword" required minlength="6">
                </div>
                <button type="submit" class="btn">Registrarme</button>
                <button type="button" class="btn" onclick="closeModal('registerModal')">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Modal Create Post -->
    <div id="createPostModal" class="modal">
        <div class="modal-content">
            <h2>Crear Publicación</h2>
            <form id="createPostForm" onsubmit="createPost(event)">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="postTitle" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="postDesc" required></textarea>
                </div>
                <div class="form-group">
                    <label>Tipo de contenido</label>
                    <select id="postType">
                        <option value="photo">Foto</option>
                        <option value="video">Video</option>
                        <option value="audio">Audio</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Archivo</label>
                    <input type="file" id="postFile" required accept="image/*,video/*,audio/*">
                </div>
                <button type="submit" class="btn">Publicar</button>
                <button type="button" class="btn" onclick="closeModal('createPostModal')">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        const CATEGORY = 'acompañantes-mujeres';
        let authToken = localStorage.getItem('authToken');

                loadFeed();
                updateUI();

        async function loadFeed() {
            try {
                const url = `${API_URL}/api/content/category/${encodeURIComponent(CATEGORY)}`;
                const response = await fetch(url);
                const data = await response.json();

                const grid = document.getElementById('feedGrid');

                if (!data.posts || data.posts.length === 0) {
                    grid.innerHTML = '<div class="no-posts">No hay publicaciones aún en esta categoría</div>';
                return;
            }

                grid.innerHTML = data.posts.map(post => {
                    const imageUrl = `${API_URL}${post.media_url || post.file_url}`;
                    const isPremium = post.is_premium || post.is_premium_user;
                    const premiumClass = isPremium ? 'premium' : '';
                    const premiumBadge = isPremium ? '<div class="premium-badge"><i class="fas fa-crown"></i> PREMIUM</div>' : '';
                    
                    return `
                    <div class="post-card ${premiumClass}" onclick="window.location.href='profile.html?user=${post.user_id}'" style="cursor: pointer;">
                        ${premiumBadge}
                        <img src="${imageUrl}" class="post-image" alt="${post.title}" onerror="this.src='https://via.placeholder.com/300x250?text=Imagen+No+Disponible'">
                        <div class="post-content">
                            <div class="post-title">${post.title}</div>
                            <div class="post-description">${post.description}</div>
                            <div class="post-user">
                                <i class="fas fa-user"></i> ${post.username}
                                ${post.is_verified ? '<i class="fas fa-check-circle" style="color: #1da1f2;" title="Usuario verificado"></i>' : ''}
                            </div>
                            <div class="post-meta">
                                <span><i class="fas fa-heart"></i> ${post.likes_count || 0}</span>
                                <span><i class="fas fa-comment"></i> ${post.comments_count || 0}</span>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading acompañantes mujeres feed:', error);
                document.getElementById('feedGrid').innerHTML = '<div class="no-posts">Error al cargar publicaciones</div>';
            }
        }

        function showLogin() {
            document.getElementById('loginModal').classList.add('show');
        }

        function showRegister() {
            document.getElementById('registerModal').classList.add('show');
        }

        function showCreatePost() {
            if (!authToken) {
                showMessage('Debes iniciar sesión primero', 'error');
                return;
            }
            document.getElementById('createPostModal').classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        async function login(e) {
            e.preventDefault();
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('ageVerified', 'true');
                    closeModal('loginModal');
                    showMessage('Login exitoso', 'success');
                    updateUI();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Error de conexión', 'error');
            }
        }

        async function register(e) {
            e.preventDefault();
            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('regUsername').value,
                        email: document.getElementById('regEmail').value,
                        password: document.getElementById('regPassword').value
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('ageVerified', 'true');

                    await fetch(`${API_URL}/api/auth/quick-verify`, {
                    method: 'POST',
                        headers: { 'Authorization': `Bearer ${authToken}` }
                });

                closeModal('registerModal');
                    showMessage('Registro exitoso y verificado', 'success');
            updateUI();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Error de conexión', 'error');
            }
        }

        async function createPost(e) {
            e.preventDefault();
            try {
                const formData = new FormData();
                formData.append('title', document.getElementById('postTitle').value);
                formData.append('description', document.getElementById('postDesc').value);
                formData.append('content_type', document.getElementById('postType').value);
                formData.append('category', CATEGORY);
                formData.append('file', document.getElementById('postFile').files[0]);
                formData.append('is_public', 'true');
                formData.append('is_premium', 'false');
                formData.append('price', '0');

                const response = await fetch(`${API_URL}/api/content`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` },
                    body: formData
                });

                const data = await response.json();
                if (response.ok) {
                    closeModal('createPostModal');
                    showMessage('Publicación creada exitosamente', 'success');
                    loadFeed();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        function updateUI() {
            const createBtn = document.getElementById('createBtn');
            if (authToken) {
                createBtn.style.display = 'inline-block';
            } else {
                createBtn.style.display = 'none';
            }
        }

        function showMessage(msg, type) {
            const box = document.getElementById('messageBox');
            box.className = type;
            box.textContent = msg;
            setTimeout(() => box.textContent = '', 3000);
        }
    </script>
</body>
</html>
