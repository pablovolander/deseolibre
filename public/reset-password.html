<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña — Deseo Libre</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/home.css" rel="stylesheet">
    <script src="/js/api-config.js"></script>
</head>
<body class="home-page">
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">Deseo Libre</a>
        </div>
    </header>

    <main class="home-main" style="min-height:70vh;display:flex;align-items:center;">
        <div class="container" style="max-width:480px;margin:0 auto;">
            <div class="modal-content" style="position:static;display:block;box-shadow:0 8px 32px rgba(0,0,0,.35);">
                <h2><i class="fas fa-key"></i> Nueva contraseña</h2>
                <p id="resetIntro" style="color:var(--text-muted, rgba(255,255,255,.7));margin-bottom:1.25rem;">
                    Elige una contraseña nueva para tu cuenta.
                </p>
                <div id="resetError" class="error-message" style="display:none;position:static;margin-bottom:1rem;"></div>
                <div id="resetSuccess" class="success-message" style="display:none;position:static;margin-bottom:1rem;"></div>

                <form id="resetPasswordForm" style="display:none;">
                    <div class="form-group">
                        <label for="newPassword">Nueva contraseña</label>
                        <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirmar contraseña</label>
                        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary" id="resetSubmitBtn">Guardar contraseña</button>
                </form>

                <p id="resetInvalid" style="display:none;">
                    Este enlace no es válido o ya expiró.
                    <a href="index.html?forgot=1">Solicita uno nuevo</a>.
                </p>
            </div>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const form = document.getElementById('resetPasswordForm');
        const errorEl = document.getElementById('resetError');
        const successEl = document.getElementById('resetSuccess');
        const invalidEl = document.getElementById('resetInvalid');
        const introEl = document.getElementById('resetIntro');

        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            successEl.style.display = 'none';
        }

        function showSuccess(message) {
            successEl.textContent = message;
            successEl.style.display = 'block';
            errorEl.style.display = 'none';
        }

        async function validateToken() {
            if (!token) {
                introEl.style.display = 'none';
                invalidEl.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/auth/reset-password/validate?token=${encodeURIComponent(token)}`);
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.valid) {
                    introEl.style.display = 'none';
                    invalidEl.style.display = 'block';
                    return;
                }
                form.style.display = 'block';
            } catch (err) {
                showError('No se pudo validar el enlace. Intenta de nuevo.');
            }
        }

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('resetSubmitBtn');

            if (password.length < 6) {
                showError('La contraseña debe tener al menos 6 caracteres');
                return;
            }
            if (password !== confirm) {
                showError('Las contraseñas no coinciden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Guardando...';

            try {
                const response = await fetch(`${API_URL}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || 'No se pudo actualizar la contraseña');
                }
                form.style.display = 'none';
                introEl.style.display = 'none';
                showSuccess(data.message || 'Contraseña actualizada. Redirigiendo al inicio...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2500);
            } catch (err) {
                showError(err.message || 'Error al guardar la contraseña');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar contraseña';
            }
        });

        validateToken();
    </script>
</body>
</html>
