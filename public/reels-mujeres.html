<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Reels Mujeres — Deseo Libre</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="/css/directory.css" rel="stylesheet">
    <link href="/css/directory-modals.css" rel="stylesheet">
    <link href="/css/reels.css?v=20260928d" rel="stylesheet">
    <link href="/css/responsive.css" rel="stylesheet">
    <link href="/css/mobile.css" rel="stylesheet">
    <link href="/css/age-gate.css" rel="stylesheet">
    <script src="/js/api-config.js"></script>
    <script src="/js/auth-session.js"></script>
    <script src="/js/age-gate.js"></script>
</head>
<body class="directory-page reels-page reels-immersive" data-reels-category="acompañantes-mujeres">
    <header class="directory-header reels-topbar">
        <div class="directory-header-inner">
            <a href="feed-mujeres.html" class="reels-back" aria-label="Volver al directorio"><i class="fas fa-chevron-left"></i></a>
            <nav class="reels-category-nav" id="reels-category-nav" aria-label="Categorías de reels"></nav>
            <a href="index.html" class="reels-home" aria-label="Inicio"><i class="fas fa-home"></i></a>
        </div>
    </header>

    <main class="reels-main">
        <section class="reels-hero reels-hero-desktop">
            <h1>Reels — Mujeres</h1>
            <p>Videos cortos. Desliza hacia arriba. Maximizado para celular.</p>
        </section>

        <div class="reels-login-gate" id="reels-login-gate">
            <p><strong>Inicia sesión</strong> para subir reels en esta categoría.</p>
            <p><a href="index.html?register=1">Registrarse o entrar</a></p>
        </div>

        <details class="reels-upload-panel" id="reels-upload-panel">
            <summary><i class="fas fa-plus"></i><span class="reels-upload-label"> Subir reel</span></summary>
            <p class="reels-upload-hint">Foto o video de hasta 45 segundos. Queda publicado hasta que lo borres.</p>
            <form class="reels-upload-form" id="reel-upload-form">
                <input type="hidden" name="category" id="reel-category-fixed" value="acompañantes-mujeres">
                <label>Texto (opcional)
                    <input type="text" name="title" maxlength="120" placeholder="Ej: Disponible en Polanco">
                </label>
                <label>Descripción (opcional)
                    <textarea name="description" maxlength="500" placeholder="Breve descripción"></textarea>
                </label>
                <div class="reels-video-pickers">
                    <span class="reels-video-pickers-label">Video (máx. 45 s)</span>
                    <input type="file" name="video" accept="video/mp4,video/webm,video/quicktime,video/*" data-mobile-upload="video" data-reel-video>
                    <input type="file" accept="video/mp4,video/webm,video/quicktime,video/*" data-mobile-upload="video-gallery" data-reel-video>
                </div>
                <div class="reels-video-pickers">
                    <span class="reels-video-pickers-label">O una foto</span>
                    <input type="file" accept="image/*" data-mobile-upload="image-pick" data-reel-image>
                </div>
                <button type="submit" class="btn-publish-reel"><i class="fas fa-upload"></i> Publicar reel</button>
                <p class="reels-status" id="reel-upload-status"></p>
            </form>
        </details>

        <p class="reels-feed-title">Reels recientes</p>
        <p class="reels-status" id="reels-feed-status"></p>
        <div class="reels-feed" id="reels-feed" tabindex="0"></div>
    </main>

    <script src="/js/video-compress.js"></script>
    <script src="/js/reels-page.js?v=20260928d"></script>
    <script src="/js/upload-mobile.js?v=20260928d"></script>
    <script src="/js/mobile-shell.js?v=20260928b"></script>
</body>
</html>
