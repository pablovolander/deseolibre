<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed CATEGORIA - Deseo Libre</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #131722;
            --charcoal: #1f2430;
            --text-light: rgba(255, 255, 255, 0.95);
            --text-muted: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(27, 32, 46, 0.9);
            --border-color: rgba(255, 255, 255, 0.14);
            --btn-gradient: linear-gradient(135deg, rgba(255, 107, 150, 0.95), rgba(108, 92, 231, 0.92));
            --btn-gradient-hover: linear-gradient(135deg, rgba(255, 120, 168, 1), rgba(131, 115, 255, 0.98));
            --shadow-heavy: 0 35px 70px rgba(0, 0, 0, 0.5);
            --shadow-soft: 0 18px 40px rgba(255, 107, 107, 0.38);
            --success: #2ecc71;
            --warning: #f0b429;
            --error: #ff4d6d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 12% 18%, rgba(255, 107, 107, 0.55), transparent 55%),
                        radial-gradient(circle at 80% 85%, rgba(255, 143, 143, 0.35), transparent 52%),
                        linear-gradient(145deg, rgba(255, 107, 150, 0.35), rgba(255, 107, 107, 0.18), rgba(27, 32, 46, 0.92));
            min-height: 100vh;
            padding: 24px;
            color: var(--text-light);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: linear-gradient(160deg, rgba(255, 107, 107, 0.28), rgba(27, 32, 46, 0.92));
            border-radius: 28px;
            padding: 38px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-heavy);
            backdrop-filter: blur(12px);
        }
        
        h1 {
            color: var(--text-light);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: 'Playfair Display', serif;
        }
        
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }
        
        .post-card {
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background: var(--card-bg);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .post-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 35px 65px rgba(0, 0, 0, 0.55);
        }

        .post-card.premium {
            border: 2px solid rgba(255, 215, 0, 0.55);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }

        .premium-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: linear-gradient(135deg, #ffd700, #ff9f1c);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
            z-index: 10;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-image-wrapper {
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .post-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .post-card:hover .post-image {
            transform: scale(1.05);
        }

        .post-content {
            padding: 22px;
        }
        
        .post-title {
            font-size: 1.25em;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-light);
        }
        
        .post-description {
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.6;
        }
        
        .post-user {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .post-actions {
            display: flex;
            gap: 14px;
            margin-top: 12px;
        }

        .post-action-btn {
            flex: 1;
            padding: 10px 14px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-light);
        }

        .post-action-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
        }

        .post-action-btn.like,
        .post-action-btn.comment {
            background: var(--btn-gradient);
            color: var(--text-light);
            border: none;
            box-shadow: var(--shadow-soft);
        }

        .post-action-btn.like.liked {
            background: var(--btn-gradient-hover);
        }

        .post-action-btn.like:hover,
        .post-action-btn.comment:hover {
            background: var(--btn-gradient-hover);
            box-shadow: 0 24px 55px rgba(255, 107, 107, 0.45);
        }

        .post-meta {
            margin-top: 12px;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.55);
            display: flex;
            gap: 18px;
        }
        
        .btn {
            background: var(--btn-gradient);
            color: var(--text-light);
            padding: 12px 30px;
            border: none;
            border-radius: 28px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 6px;
            font-weight: 600;
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 55px rgba(255, 107, 107, 0.45);
            background: var(--btn-gradient-hover);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 16, 24, 0.75);
            z-index: 1000;
            backdrop-filter: blur(6px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(150deg, rgba(255, 107, 107, 0.28), rgba(27, 32, 46, 0.94));
            padding: 34px;
            border-radius: 20px;
            max-width: 620px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-heavy);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        }

        .modal-title {
            font-size: 1.5em;
            color: var(--text-light);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.8em;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.65);
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: var(--text-light);
        }

        .comments-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comment-item {
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .comment-user {
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .comment-text {
            color: var(--text-muted);
        }

        .comment-form {
            display: flex;
            gap: 12px;
        }

        .comment-input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-light);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
        }
        
        .error {
            color: var(--error);
            padding: 12px;
            background: rgba(255, 77, 109, 0.16);
            border-radius: 12px;
            margin: 12px 0;
            border-left: 4px solid var(--error);
        }
        
        .success {
            color: var(--success);
            padding: 12px;
            background: rgba(46, 204, 113, 0.16);
            border-radius: 12px;
            margin: 12px 0;
            border-left: 4px solid var(--success);
        }
        
        .no-posts {
            text-align: center;
            padding: 50px;
            color: rgba(255, 255, 255, 0.65);
        }

        #messageBox {
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span style="font-size: 2em;">ICONO</span> TITULO_CATEGORIA</h1>
        
        <div>
            <button class="btn" onclick="showLogin()">Iniciar Sesión</button>
            <button class="btn" onclick="showRegister()">Registrarse</button>
            <button class="btn" onclick="showCreatePost()" id="createBtn" style="display:none;">Crear Publicación</button>
        </div>

        <div id="messageBox"></div>

        <div id="feedGrid" class="feed-grid">
            <div class="no-posts">Cargando publicaciones...</div>
        </div>
    </div>

    <!-- Modal Login -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm" onsubmit="login(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn">Entrar</button>
                <button type="button" class="btn" onclick="closeModal('loginModal')">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Modal Register -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h2>Registrarse</h2>
            <form id="registerForm" onsubmit="register(event)">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="regUsername" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPassword" required minlength="6">
                </div>
                <button type="submit" class="btn">Registrarme</button>
                <button type="button" class="btn" onclick="closeModal('registerModal')">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Modal Create Post -->
    <div id="createPostModal" class="modal">
        <div class="modal-content">
            <h2>Crear Publicación</h2>
            <form id="createPostForm" onsubmit="createPost(event)">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="postTitle" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="postDesc" required></textarea>
                </div>
                <div class="form-group">
                    <label>Tipo de contenido</label>
                    <select id="postType">
                        <option value="photo">Foto</option>
                        <option value="video">Video</option>
                        <option value="audio">Audio</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Archivo</label>
                    <input type="file" id="postFile" required accept="image/*,video/*,audio/*">
                </div>
                <button type="submit" class="btn">Publicar</button>
                <button type="button" class="btn" onclick="closeModal('createPostModal')">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Modal Comments -->
    <div id="commentsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Comentarios</h2>
                <button class="modal-close" onclick="closeModal('commentsModal')">&times;</button>
            </div>
            <div id="commentsList" class="comments-list">
                <!-- Comments will be loaded here -->
            </div>
            <div class="comment-form">
                <input type="text" id="commentInput" class="comment-input" placeholder="Escribe un comentario...">
                <button class="btn" onclick="addComment()">Enviar</button>
            </div>
        </div>
    </div>

        <script src="/js/api-config.js"></script>
    <script src="/js/category-feed.js"></script>
    <script>initCategoryFeedPage('CATEGORIA_ID');</script>
</body>
</html>
